<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agri Platform Prototype</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <h1>Agri Platform Prototype</h1>
    </header>
    <main>
      <section id="auth">
        <h2>Auth</h2>
        <div>
          <input id="regName" placeholder="Name" />
          <input id="regEmail" placeholder="Email" />
          <input id="regPass" placeholder="Password" type="password" />
          <select id="regRole"><option value="farmer">Farmer</option><option value="company">Company</option><option value="institution">Institution</option><option value="other">Other</option></select>
          <button id="btnRegister">Register</button>
        </div>
        <div>
          <input id="loginEmail" placeholder="Email" />
          <input id="loginPass" placeholder="Password" type="password" />
          <button id="btnLogin">Login</button>
        </div>
      </section>

      <section id="createAd" style="display:none">
        <h2>Create Ad</h2>
        <input id="adTitle" placeholder="Title" />
        <select id="adType"><option value="sell">Sell</option><option value="buy">Buy</option></select>
        <input id="adCrop" placeholder="Crop" />
        <input id="adVariety" placeholder="Variety" />
        <input id="adVolume" placeholder="Volume" />
        <input id="adRegion" placeholder="Region" />
        <input id="adPrice" placeholder="Price" />
        <input id="adDelivery" placeholder="Delivery time" />
        <textarea id="adSpecs" placeholder="Specs"></textarea>
        <button id="btnCreateAd">Create</button>
      </section>

      <section id="adsList">
        <h2>Ads</h2>
        <div id="ads"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
